# OpenEMR on Railway — importable Compose file (drag onto the project canvas).
#
# Railway does NOT run this file. Each service below becomes a separate Railway
# service; volumes, variables and domains still need setting in the dashboard.
# See README.md in this directory for the full procedure.
#
# Differences from deploy/digitalocean/docker-compose.yml, and why:
#   - No DOMAIN/EMAIL: Railway terminates TLS at its edge, so the container
#     serves plain HTTP on $PORT (80). Setting DOMAIN would make the image run
#     certbot, which cannot answer the ACME challenge from behind Railway's proxy.
#   - One volume per service (a Railway limit): OpenEMR keeps only `sites/`
#     (site config, documents, OAuth keys). Log and Let's Encrypt volumes are dropped;
#     logs go to Railway's log view.
#   - No `ports: 443`: Railway routes one target port per domain.
#   - No `depends_on`: unsupported. The image's own wait_for_mysql() retries
#     until MariaDB answers, so ordering takes care of itself.
#   - No healthcheck block: Railway healthchecks are configured per service
#     (path /meta/health/readyz), and only run at deploy time.
services:
  # Prefer Railway's MariaDB template instead of this service (it generates
  # credentials and attaches the volume for you). This entry exists so the
  # Compose import creates something sane if you drag this file in.
  mysql:
    image: mariadb:11.8.8
    command: ['mariadbd', '--character-set-server=utf8mb4']
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:?set in Railway variables}

  openemr:
    # Built from this repository by build_openemr_image.sh (8.2.0-dev, the code the dev stack runs),
    # not the stock openemr/openemr:latest (8.0.0) this deployment used until 2026-09-25.
    image: debulearn4ever/openemr-agent:8.2.0-dev-9a73bae@sha256:9ca639c3fb87c65dff20543bb5a47c8e5f954b96dfeaee456cd8f473126841e6
    ports:
      - '80:80'
    volumes:
      - sitevolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      # Railway routes public traffic to $PORT; the image's Apache already serves
      # HTTP on 80 and its HTTPS redirect is commented out by default.
      PORT: '80'

      # Private networking: <service-name>.railway.internal. The live services are
      # mysql-v82 / openemr-v82 (Railway service names are unique per project).
      MYSQL_HOST: mysql-v82.railway.internal
      MYSQL_PORT: '3306'
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASS:?set in Railway variables}
      MYSQL_USER: openemr
      MYSQL_PASS: ${MYSQL_PASS:?set in Railway variables}
      OE_USER: admin
      OE_PASS: ${OE_PASS:?set in Railway variables}
      # 'yes' for the FIRST boot only: it makes the image copy sites/ into the empty Railway
      # volume. Then set 'no' -- see README "Building from this checkout" for why.
      SWARM_MODE: 'yes'

      # First install takes ~5-10 minutes; Railway's healthcheck default is 300 s.
      RAILWAY_HEALTHCHECK_TIMEOUT_SEC: '900'

      # Must be the public Railway URL, or OAuth/SMART issuer URLs come out wrong.
      OPENEMR_SETTING_site_addr_oath: https://${PUBLIC_DOMAIN:?set in Railway variables}
      OPENEMR_SETTING_rest_api: '1'
      OPENEMR_SETTING_rest_fhir_api: '1'
      OPENEMR_SETTING_rest_system_scopes_api: '1'
      # Minimal API logging: the default (2) stores full PHI response bodies in
      # api_log with no retention. See AUDIT.md S7 / C2b.
      OPENEMR_SETTING_api_log_option: '1'
      # Needed by the usecases suite and the agent's token flow. Security tradeoff
      # recorded in AUDIT.md S1; drop to 0 once SMART authorization-code is in place.
      OPENEMR_SETTING_oauth_password_grant: '3'

volumes:
  databasevolume: {}
  sitevolume: {}
