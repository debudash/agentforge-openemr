<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Served by OpenEMR from public/dashboard/ (ADR 0008), so the policy lives here rather than in
      a header. Scripts, styles and requests are limited to this origin; no inline script, no
      eval, no plugins, no framing of other origins, no form posts anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:," />
    <title>Patient Dashboard</title>
  </head>
  <body class="bg-light">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
