$kind: http-request
description: "Week 2. Reads the fixture two-page lab report with the vision model and returns a LabDocument: every field with a page and quote citation, unsupported fields null with confidence 0. On the free tier this can answer 502 rate_limit; that is the provider's quota, said plainly, not a fault."
url: "{{baseUrl}}/documents/extract"
method: POST
body:
  type: json
  content: |-
    {
      "pid": 101,
      "doc_id": 412,
      "doc_type": "lab_pdf",
      "filename": "metro-labs-jane-doe.pdf",
      "mime": "application/pdf",
      "content_base64": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("read, or refused with a named reason", function () { pm.expect([200, 502, 503]).to.include(pm.response.code); });
      if (pm.response.code === 200) { var d = pm.response.json(); console.log("results", d.document.results.length, "unsupported", d.unsupported_fields);
        pm.test("every supported value carries a page and quote", function () { d.document.results.forEach(function (r) { if (r.value.value !== null) { pm.expect(r.value.citation.page).to.be.a("number"); pm.expect(r.value.citation.quote).to.be.a("string"); } }); }); }
    language: text/javascript
order: 10000
