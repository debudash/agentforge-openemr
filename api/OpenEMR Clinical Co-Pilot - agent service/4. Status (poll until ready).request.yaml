$kind: http-request
description: Per-patient readiness. Poll this until every patient reads ready or failed; a brief takes roughly 10-30 s on the free tier, and the whole list has a 90 s budget.
url: "{{baseUrl}}/session/{{sessionId}}/status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      var p = pm.response.json().patients || [];
      console.log(p.map(function (x) { return x.pid + '=' + x.status; }).join(', '));
      pm.test("every patient has a status", function () { pm.expect(p.length).to.be.above(0); });

      // Briefs take 10-30 s each, so this request re-runs itself until they land. That is
      // what lets the whole collection work from a single Run instead of needing a human
      // to watch it. Bounded, so a stuck brief ends the loop rather than spinning forever.
      var settled = p.length > 0 && p.every(function (x) { return x.status === 'ready' || x.status === 'failed'; });
      var tries = Number(pm.collectionVariables.get('statusTries') || 0);
      if (!settled && tries < 40) {
          pm.collectionVariables.set('statusTries', tries + 1);
          postman.setNextRequest('4. Status (poll until ready)');
      } else {
          pm.collectionVariables.set('statusTries', 0);
          pm.test('briefs finished generating', function () { pm.expect(settled).to.be.true; });
      }
    language: text/javascript
order: 4000
