$kind: http-request
description: "Week 2. Page 1 of the fixture report as an image, with a box where 'Potassium' is printed. No model: a box is where the text layer says the text is, or found is false."
url: "{{baseUrl}}/documents/page"
method: POST
body:
  type: json
  content: |-
    {
      "pid": 101,
      "doc_id": 412,
      "page": 1,
      "quotes": [
        "Potassium",
        "Hemoglobin A1c"
      ],
      "content_base64": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", function () { pm.response.to.have.status(200); });
      var d = pm.response.json();
      pm.test("the printed quote is boxed, the absent one is not", function () { pm.expect(d.boxes[0].found).to.eql(true); pm.expect(d.boxes[1].found).to.eql(false); pm.expect(d.image_base64.slice(0, 11)).to.eql("iVBORw0KGgo"); });
    language: text/javascript
order: 12000
