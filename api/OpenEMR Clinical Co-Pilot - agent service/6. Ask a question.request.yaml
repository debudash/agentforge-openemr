$kind: http-request
description: A follow-up about the active patient. Every claim in the answer must cite a record a tool returned in this same turn; anything else is deleted before it is returned and listed in removed_claims. Try an out-of-scope pid to see access_denied, or an off-topic question to see the scope statement.
url: "{{baseUrl}}/session/{{sessionId}}/ask"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pid": 101,
      "question": "What was her most recent potassium?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", function () { pm.response.to.have.status(200); });
      var r = pm.response.json();
      console.log('state', r.state, '| tools', (r.tool_calls||[]).join(' -> '), '| removed', (r.removed_claims||[]).length);
      pm.collectionVariables.set('lastRunId', r.langsmith_run_id || '');
      pm.test("every claim carries a citation", function () {
        (r.claims || []).forEach(function (c) { pm.expect(c.source_ids.length).to.be.above(0); });
      });
    language: text/javascript
order: 6000
